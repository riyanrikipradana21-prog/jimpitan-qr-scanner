
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan QR Rumah - Jimpitan</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#061b35;color:#fff;margin:0;padding:18px}
.panel{max-width:520px;margin:auto;background:white;color:#152536;padding:24px;border-radius:28px}
h1{font-size:28px}
.status{background:#eaf4ff;padding:14px;border-radius:12px;line-height:1.5}
button{width:100%;padding:17px;margin:8px 0;border:0;border-radius:14px;background:#0878cf;color:white;font-size:18px;font-weight:bold}
#reader{width:100%;margin-top:14px}
</style>
</head>
<body>
<main class="panel">
<h1>📷 Scan QR Rumah</h1>
<p>JIMPITAN WARGA · DK PUCUNG</p>
<div id="status" class="status">Tekan tombol untuk mengaktifkan kamera.</div>
<button id="startBtn" type="button">Mulai / Ulangi Kamera</button>
<button id="backBtn" type="button">Kembali tanpa scan</button>
<div id="reader"></div>
<p>Arahkan kamera ke QR rumah. QR cukup berisi kode rumah.</p>
</main>
<script>
let scanner = null;
let running = false;

function status(message) {
  document.getElementById("status").textContent = message;
}

async function startScan() {
  const button = document.getElementById("startBtn");
  button.disabled = true;
  status("Meminta akses kamera...");

  try {
    if (!window.isSecureContext) {
      throw new Error("Halaman harus dibuka melalui HTTPS.");
    }
    if (typeof Html5Qrcode === "undefined") {
      throw new Error("Library pemindai gagal dimuat. Periksa koneksi internet.");
    }

    if (!scanner) {
      scanner = new Html5Qrcode("reader");
    }
    if (running) {
      await scanner.stop();
      running = false;
    }

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      (decodedText) => {
        status("QR terbaca: " + decodedText);
        scanner.stop().catch(() => {});
        running = false;

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(
            { type: "JIMPITAN_QR_RESULT", code: decodedText },
            "*"
          );
          status("Kode terkirim ke aplikasi. Silakan kembali ke tab aplikasi.");
        } else {
          status("QR terbaca. Kode: " + decodedText + ". Kembali ke aplikasi Jimpitan.");
        }
      },
      () => {}
    );

    running = true;
    status("Kamera aktif. Arahkan ke QR rumah.");
  } catch (error) {
    status("Kamera gagal dibuka: " + (error.message || error));
  } finally {
    button.disabled = false;
  }
}

function goBack() {
  if (window.opener && !window.opener.closed) {
    window.close();
  } else {
    history.back();
  }
}

document.getElementById("startBtn").addEventListener("click", startScan);
document.getElementById("backBtn").addEventListener("click", goBack);
</script>
</body>
</html>
